# POC topology — source of truth for get_service_topology().
# Production replaces this file with a Neo4j 2-3 hop subgraph query.
# (demo_data/topology.yaml mirrors this file for the container.)
version: 1

services:
  api-gateway:
    kind: gateway
    downstream: [auth-service, routing-engine, telemetry-writer]
    notes: "Shares one fixed worker thread pool across all routes; retries telemetry-writer."
  auth-service:
    kind: service
    downstream: []
    notes: "Healthy at OS level in the demo incident."
  routing-engine:
    kind: service
    downstream: []
    notes: "Healthy at OS level; impacted by gateway congestion (retransmits are a symptom)."
  telemetry-writer:
    kind: service
    downstream: [nvme-tmpfs]
    notes: "Writes metrics to a 1MB tmpfs cap. ENOSPC is the demo root cause."
  nvme-tmpfs:
    kind: storage
    downstream: []
    notes: "Docker tmpfs mount capped at 1MB."
  client-simulator:
    kind: client
    downstream: [api-gateway]
    notes: "Generates load; retry storm is the visible symptom."
